server.port=8080
spring.application.name=monster-gym

app.db.path=./monster-gym.db

spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=America/Mexico_City

# Sesión por cookie HttpOnly (sin jsessionid en la URL)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=12h

# El login lo maneja AuthController; no se usa el usuario generado de Spring Boot
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Administrador inicial: solo se crea si no existe ningún administrador activo.
# Los valores vienen de variables de entorno, nunca del código.
app.admin.username=${MONSTER_ADMIN_USERNAME:}
app.admin.name=${MONSTER_ADMIN_NAME:Administrador}
app.admin.pin=${MONSTER_ADMIN_PIN:}

# Impresora de tickets: real = PT-210 por ESC/POS (transporte en setting.printer_transport);
# fake = guarda los tickets en app.printer.fake-dir. Reintentos: esperas en ms entre intentos.
app.printer.mode=${MONSTER_PRINTER_MODE:real}
app.printer.fake-dir=tickets-dev
app.printer.fake-fail=false
app.printer.retry-delays-ms=5000,15000,30000

# Lector de huella: real = U.are.U 4500 (One Touch SDK + RTE de DigitalPersona); fake = lector simulado.
app.fingerprint.mode=${MONSTER_FINGERPRINT_MODE:real}

# Respaldos de la base: uno diario (cron en hora de México) y al arrancar si hoy todavía no hay uno.
# MONSTER_BACKUP_DIR puede apuntar a una USB o a una carpeta sincronizada (OneDrive, Google Drive).
app.backup.dir=${MONSTER_BACKUP_DIR:respaldos}
app.backup.keep-days=${MONSTER_BACKUP_KEEP_DAYS:30}
app.backup.cron=${MONSTER_BACKUP_CRON:0 30 23 * * *}
app.backup.on-startup=true
# Subir un respaldo para restaurarlo
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
