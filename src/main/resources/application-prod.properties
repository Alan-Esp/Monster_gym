# Producción (PC del gimnasio). Lo activa el instalador: -Dspring.profiles.active=prod
# Todos los datos viven fuera de la carpeta del programa, para poder actualizarlo sin perder nada.
app.data-dir=${MONSTER_DATA_DIR:C:/MonsterGym/datos}
app.db.path=${app.data-dir}/monster-gym.db
app.backup.dir=${MONSTER_BACKUP_DIR:${app.data-dir}/respaldos}

# Log en archivo (un archivo por día, se conservan 30)
logging.file.name=${app.data-dir}/logs/monster-gym.log
logging.logback.rollingpolicy.file-name-pattern=${app.data-dir}/logs/monster-gym-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=30

# Solo se abre desde la misma PC (sin aviso del firewall de Windows ni acceso desde la red)
server.address=127.0.0.1
